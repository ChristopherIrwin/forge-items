id: guardian_chestplate
material: NETHERITE_CHESTPLATE
name: "<gradient:#7dff9a:#2ecc71>Guardian Chestplate</gradient>"
lore:
  - "<gray>Equip: gain the Guardian's blessing"
  - "<gray>Worn: slowly mends its wearer"
  - ""
  - "<dark_gray>It watches over you."
enchantments:
  minecraft:protection: 4
attributes:
  minecraft:armor:
    amount: 2
    operation: ADD_NUMBER
    slot: ANY
unbreakable: true
max-stack-size: 1
keep-on-death: true
activators:
  blessing:
    trigger: EQUIP
    actions:
      - "message <green><bold>Guardian's blessing <green>protects you."
      - "potion minecraft:resistance 600 0"
  fading:
    trigger: UNEQUIP
    actions:
      - "message <gray>The Guardian's blessing fades..."
  mending_aura:
    trigger: LOOP
    cooldown-seconds: 10
    conditions:
      min-health: 1.0
      max-health: 19.0
    actions:
      - "heal 2"
      - "message <green>✚ Mending aura restores you."
