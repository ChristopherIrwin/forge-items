name: ForgeItems
version: 3.0.0
main: com.forge.items.ForgeItems
api-version: '26.3'
author: Forge
description: YAML-defined custom items with activators, actions, sets, recipes and cooldowns.
commands:
  forgeitems:
    description: Manage ForgeItems custom items.
    usage: /forgeitems <reload|give|list|menu>
    aliases: [fitems]
permissions:
  forgeitems.admin:
    description: Reload ForgeItems and manage items.
    default: op
  forgeitems.give:
    description: Give ForgeItems custom items to players.
    default: op
  forgeitems.list:
    description: List available ForgeItems custom items.
    default: true
  forgeitems.menu:
    description: Open the ForgeItems item browser.
    default: true
